name: Build Android Worker APK

on:
  push:
    paths:
      - 'apps/android-worker/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: apps/android-worker
        run: gradle assembleDebug --no-daemon

      - name: Upload ShiftFocus Worker APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftFocus-Worker-APK
          path: apps/android-worker/app/build/outputs/apk/debug/app-debug.apk
